[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Biostatistics-and-ML"
version = "0.1.0"
description = "Scripts for processing and exploring TCP/UCLA MRI data"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",  # TSNE(max_iter=...) appeared in 1.5
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
[tool.setuptools]
py-modules = ["constants"]

[tool.setuptools.packages.find]
namespaces = false
exclude = ["tests*"]
